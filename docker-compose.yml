# MetaHarmonizer — base stack (prod-safe): Postgres + Redis + API + worker +
# Caddy (serving the built SPA). Shared by dev and prod.
#
#   dev :  docker compose up            # auto-loads docker-compose.override.yml
#                                        # (code bind-mounts, --reload, host ports)
#   prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The same image runs the API and the worker; the `command` differs.

name: metaharmonizer

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mh_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-metaharmonizer}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mh} -d ${POSTGRES_DB:-metaharmonizer}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  volume-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    volumes:
      - engine_cache:/volumes/engine_cache
      - hf_cache:/volumes/hf_cache
      - corpus_data:/volumes/corpus_data
      - uploads:/volumes/uploads
      - schema_versions:/volumes/schema_versions
      - schema_aliases:/volumes/schema_aliases
    command: ["sh", "-c", "touch /volumes/engine_cache/.initialized /volumes/hf_cache/.initialized /volumes/corpus_data/.initialized /volumes/uploads/.initialized /volumes/schema_versions/.initialized /volumes/schema_aliases/.initialized && chown -R 1000:1000 /volumes/engine_cache /volumes/hf_cache /volumes/corpus_data /volumes/uploads /volumes/schema_versions /volumes/schema_aliases"]
    restart: "no"

  api:
    image: metaharmonizer-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal DSNs override any host-style values in .env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mh}:${POSTGRES_PASSWORD:-mh_dev_password}@postgres:5432/${POSTGRES_DB:-metaharmonizer}
      REDIS_URL: redis://redis:6379/0
      METAHARMONIZER_DATA_DIR: /app/data
      HOME: /home/app
      # Real ontology mapping (NCIt/UBERON via the engine KB). Falls back to the
      # curated dictionary if the KB isn't seeded, so it's safe on by default.
      ONTOLOGY_ENGINE: "${ONTOLOGY_ENGINE:-1}"
      # Load embedding models from the seeded caches only — never the network.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - engine_cache:/home/app/.metaharmonizer
      - hf_cache:/home/app/.cache/huggingface   # schema model (all-MiniLM-L6-v2), seeded offline
      - corpus_data:/app/data/corpus       # seeded ontology corpus (kb-import writes, api/worker read)
      - uploads:/app/data/uploads          # shared with the worker so queue mode can read uploads
      - schema_versions:/app/data/schema/versions  # admin-uploaded schema versions (shared + persistent)
      - schema_aliases:/app/data/schema/aliases    # admin-uploaded alias dictionary (shared + persistent)
      - ./metadata_samples:/metadata_samples:ro    # curated_meta.csv reference (CURATED_PATH); lives at repo root, outside the backend build context
    # Run migrations on startup, then serve (idempotent). Postgres is healthy
    # via depends_on, so a compose-based run needs no separate migrate step.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  worker:
    # API and worker run the same application image; only their commands differ.
    # A single tag prevents code drift and avoids duplicating the large ML image.
    image: metaharmonizer-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mh}:${POSTGRES_PASSWORD:-mh_dev_password}@postgres:5432/${POSTGRES_DB:-metaharmonizer}
      REDIS_URL: redis://redis:6379/0
      METAHARMONIZER_DATA_DIR: /app/data
      HOME: /home/app
      # Real ontology mapping (NCIt/UBERON via the engine KB). Falls back to the
      # curated dictionary if the KB isn't seeded, so it's safe on by default.
      ONTOLOGY_ENGINE: "${ONTOLOGY_ENGINE:-1}"
      # Load embedding models from the seeded caches only — never the network.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - engine_cache:/home/app/.metaharmonizer
      - hf_cache:/home/app/.cache/huggingface   # schema model, same cache as the API
      - corpus_data:/app/data/corpus       # same corpus volume as the API
      - uploads:/app/data/uploads          # same volume as the API — reads the uploaded file
      - schema_versions:/app/data/schema/versions  # same schema-version store as the API
      - schema_aliases:/app/data/schema/aliases    # same alias store as the API
      - ./metadata_samples:/metadata_samples:ro    # curated_meta.csv reference (CURATED_PATH); same as the API
    # arq worker (Sprint 4). Set JOB_MODE=queue so the API enqueues here.
    # Scale concurrency with `docker compose up --scale worker=N`.
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    healthcheck:
      # arq --check exits non-zero if the worker's Redis health key is stale,
      # so an orchestrator can detect a hung/crashed worker.
      test: ["CMD", "arq", "--check", "app.workers.arq_worker.WorkerSettings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      volume-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    user: "1000:1000"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv:ro          # SPA static assets, published by the `web` service
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_completed_successfully
      caddy-volume-init:
        condition: service_completed_successfully

  caddy-volume-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    volumes:
      - caddy_data:/volumes/data
      - caddy_config:/volumes/config
    command: ["sh", "-c", "touch /volumes/data/.initialized /volumes/config/.initialized && chown -R 1000:1000 /volumes/data /volumes/config"]
    restart: "no"

  # One-shot: builds the React SPA and publishes it into the shared `web_dist`
  # volume, then exits. Caddy serves those assets. Re-run after a frontend change
  # with `docker compose up --build web`.
  web:
    build:
      context: ./frontend
    volumes:
      - web_dist:/srv
    depends_on:
      web-volume-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    restart: "no"

  web-volume-init:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    user: "0:0"
    volumes:
      - web_dist:/srv
    command: ["sh", "-c", "touch /srv/.initialized && chown -R 1000:1000 /srv"]
    restart: "no"

  # One-shot: seed a prebuilt knowledge DB into the engine_cache volume before
  # starting the ontology worker. Opt-in via the `kb` profile:
  #   docker compose --profile kb run --rm kb-import
  # Place the bundle at ./kb/<KB_ARCHIVE> on the host (default
  # kb_offline_bundle.tar.gz, produced by `python -m scripts.package_kb`). The
  # bundle carries the engine KB *and* the corpus CSVs the ontology engine loads
  # at runtime, so a fresh instance never re-downloads ontologies from NCI/OLS.
  kb-import:
    image: metaharmonizer-api
    profiles: ["kb"]
    environment:
      # Match the api/worker data root so seed_kb installs the corpus where they
      # read it (/app/data/corpus), not the engine's default (~/.metaharmonizer).
      METAHARMONIZER_DATA_DIR: /app/data
      HOME: /home/app
      # Auto-download the bundle when it isn't provided locally at ./kb. Publish
      # it once (python -m scripts.package_kb) and set KB_BUNDLE_URL in .env; the
      # command below fetches it to a writable path, then seeds the volumes.
      KB_BUNDLE_URL: "${KB_BUNDLE_URL:-}"
      KB_BUNDLE_SHA256: "${KB_BUNDLE_SHA256:-}"
    volumes:
      - engine_cache:/home/app/.metaharmonizer
      - hf_cache:/home/app/.cache/huggingface   # seed the schema model into the shared HF cache
      - corpus_data:/app/data/corpus       # seed the corpus into the shared volume api/worker read
      - ./kb:/kb:ro
    # Use ./kb/<archive> if it's mounted there, otherwise download from KB_BUNDLE_URL.
    command: ["sh", "-c", "F=/kb/${KB_ARCHIVE:-kb_offline_bundle.tar.gz}; if [ -f \"$$F\" ]; then python -m scripts.seed_kb \"$$F\" --force; else python -m scripts.seed_kb /tmp/kb_offline_bundle.tar.gz --force; fi"]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # One-shot: create the bootstrap admin account. Opt-in via the `seed` profile:
  #   docker compose --profile seed run --rm seed
  # Override the identity with SEED_EMAIL / SEED_PASSWORD / SEED_ROLE.
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["seed"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mh}:${POSTGRES_PASSWORD:-mh_dev_password}@postgres:5432/${POSTGRES_DB:-metaharmonizer}
      SEED_EMAIL: ${SEED_EMAIL:-admin@example.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMe!2026}
      SEED_ROLE: ${SEED_ROLE:-admin}
    command: ["python", "-m", "scripts.seed_account"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  pg_data:
  redis_data:
  engine_cache:
    name: ${ENGINE_CACHE_VOLUME:-metaharmonizer_engine_cache}
  corpus_data:
    name: ${CORPUS_DATA_VOLUME:-metaharmonizer_corpus_data}
  hf_cache:
    name: ${HF_CACHE_VOLUME:-metaharmonizer_hf_cache}
  web_dist:
  uploads:
  schema_versions:
  schema_aliases:
  caddy_data:
  caddy_config:
