# MetaHarmonizer — dev-only overrides (auto-loaded by `docker compose up`).
#
# Adds the developer conveniences the prod-safe base intentionally omits:
#   - live code bind-mounts + uvicorn --reload
#   - host port exposure for Postgres / Redis / API
#   - Caddy on :8080 (http, no TLS)
#
# Prod skips this file by passing explicit -f flags:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    # Dev-only JWT secret so `cp .env.example .env && docker compose up` boots
    # without a manual step. Overrides the .env placeholder (which the app
    # rejects). Production uses docker-compose.prod.yml (which skips this file)
    # and must supply a real JWT_SECRET.
    environment:
      JWT_SECRET: dev-secret-key-at-least-32-bytes-long-please
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # live code reload in dev
      - engine_cache:/home/app/.metaharmonizer
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  worker:
    environment:
      JWT_SECRET: dev-secret-key-at-least-32-bytes-long-please
    volumes:
      - ./backend:/app
      - engine_cache:/home/app/.metaharmonizer

  caddy:
    ports:
      - "8080:80"
