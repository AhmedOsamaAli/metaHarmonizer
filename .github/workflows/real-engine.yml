name: real-engine

# Exercises the ACTUAL upstream metaharmonizer engine (not the mock) on a tiny
# input, so drift between our adapter and the real engine's output contract is
# caught automatically — the fast CI suite runs against the mock only.
#
# Scope: the SCHEMA path (SchemaMapEngine), which downloads the MiniLM encoder
# but needs no KB bundle. The ontology path (OntoMapEngine) additionally needs
# the ~1.4 GB FAISS/model bundle from the `kb-latest` release; see the commented
# job below to extend to it once you're ready to pay that cost on a schedule.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1" # weekly — Monday 04:00 UTC

concurrency:
  group: real-engine
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend + vendored engine wheel
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Real-engine schema mapping (MiniLM download; no KB)
        working-directory: backend
        env:
          ENGINE_IMPL: metaharmonizer
          RUN_REAL_ENGINE: "1"
          METAHARMONIZER_DATA_DIR: ${{ github.workspace }}/backend/data
        run: pytest tests/integration/test_engine_real.py -q

  # ---------------------------------------------------------------------------
