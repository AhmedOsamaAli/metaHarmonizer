name: Real Engine Regression

# Exercises the ACTUAL upstream metaharmonizer engine (not the mock) on a tiny
# input, so drift between our adapter and the real engine's output contract is
# caught automatically — the fast CI suite runs against the mock only.
#
# The schema job downloads the MiniLM encoder. The ontology job downloads and
# checksum-verifies the published ~1.5 GB FAISS/model bundle, probes all required
# assets offline, and runs a real UBERON mapping.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 4 * * 1" # weekly — Monday 04:00 UTC

concurrency:
  group: real-engine
  cancel-in-progress: true

jobs:
  schema:
    name: Real Schema Mapping
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend + vendored engine wheel
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Real-engine schema mapping (MiniLM download; no KB)
        working-directory: backend
        env:
          ENGINE_IMPL: metaharmonizer
          RUN_REAL_ENGINE: "1"
          METAHARMONIZER_DATA_DIR: ${{ github.workspace }}/backend/data
        run: pytest tests/integration/test_engine_real.py -q

  ontology:
    name: Real Ontology Mapping
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch and verify the published KB bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kb"
          gh release download kb-latest \
            -p kb_offline_bundle.tar.gz \
            -p kb_offline_bundle.sha256 \
            -D "$RUNNER_TEMP/kb"
          cd "$RUNNER_TEMP/kb"
          sha256sum --check kb_offline_bundle.sha256
      - name: Seed and probe the offline bundle
        working-directory: backend
        env:
          METAHARMONIZER_DATA_DIR: ${{ github.workspace }}/backend/data
          KNOWLEDGE_DB_DIR: ${{ github.workspace }}/backend/kb_build
          HF_HOME: ${{ runner.temp }}/huggingface
        run: |
          python -m scripts.seed_kb "$RUNNER_TEMP/kb/kb_offline_bundle.tar.gz" --force
          python -m scripts.kb_probe
      - name: Real-engine ontology mapping
        working-directory: backend
        env:
          ENGINE_IMPL: metaharmonizer
          ONTOLOGY_ENGINE: "1"
          RUN_REAL_ENGINE: "1"
          RUN_REAL_ONTOLOGY: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          METAHARMONIZER_DATA_DIR: ${{ github.workspace }}/backend/data
          KNOWLEDGE_DB_DIR: ${{ github.workspace }}/backend/kb_build
          HF_HOME: ${{ runner.temp }}/huggingface
        run: pytest tests/integration/test_engine_real.py -q -k ontology
