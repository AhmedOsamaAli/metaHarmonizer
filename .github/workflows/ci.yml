name: Application CI

# Lint/typecheck/test/build gate for every push + PR.
# The engine boundary + mock smoke test live in engine-boundary.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mh
          POSTGRES_PASSWORD: mh_dev_password
          POSTGRES_DB: metaharmonizer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mh -d metaharmonizer"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      # Point the suite at the CI service containers (conftest reads these).
      DATABASE_URL: postgresql+asyncpg://mh:mh_dev_password@localhost:5432/metaharmonizer
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-secret-key-at-least-32-bytes-long!!
      # Tests run against the mock adapter (engine ML stack not exercised).
      ENGINE_IMPL: mock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: >-
          pytest -q
          --cov=app
          --cov-fail-under=60
          --cov-report=term
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npm test --if-present -- --coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 30

  mcp:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installed from a different directory: the repository's own `mcp/` folder
      # is an implicit namespace package and shadows the SDK when the working
      # directory is the repository root.
      - name: Install the MCP server and its test dependencies
        run: pip install -e "./mcp[dev]"
      - name: Run tests
        working-directory: mcp
        env:
          ENGINE_IMPL: mock
        run: pytest tests -q
