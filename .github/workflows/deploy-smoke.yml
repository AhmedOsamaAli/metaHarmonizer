name: Container Deployment Smoke

# Verifies the self-host deployment shape (U15): the docker-compose stack
# builds, boots, runs migrations, and serves an authenticated request — the
# packaging layer that can't be exercised on a dev box without Docker.
#
# Uses ENGINE_IMPL=mock so the container wiring (Postgres + Redis + API +
# worker + migrations + auth) is validated without pulling the ~700 MB ML
# models or the offline KB bundle. The real engine is covered separately by
# the native backend suite; this job proves the *deployment*, not the ML.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker-compose.yml"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-smoke.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Build, Scan, and Runtime Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Minimal env the api/worker/seed services read via `env_file: .env`.
      - name: Write .env
        run: |
          cat > .env <<'EOF'
          ENGINE_IMPL=mock
          JOB_MODE=queue
          AUTH_MODE=jwt
          HIBP_CHECK=false
          JWT_SECRET=ci-smoke-secret-key-at-least-32-bytes-long!!
          ALLOWED_EMAIL_DOMAINS=example.com
          SEED_EMAIL=admin@example.com
          SEED_PASSWORD=CiSmoke!2026
          SEED_ROLE=admin
          EOF

      # CI-only override: publish the API and the Caddy origin so the runner can
      # reach both the API directly and the served SPA for the browser journey.
      - name: Write CI compose override
        run: |
          cat > docker-compose.ci.yml <<'EOF'
          services:
            api:
              ports:
                - "8000:8000"
            caddy:
              ports:
                - "8080:80"
          EOF

      - name: Build application images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build api web

      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.73.0"
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfL "$base/$archive" -o "/tmp/$archive"
          curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy-checksums.txt
          grep " $archive$" /tmp/trivy-checksums.txt | sed 's|  |  /tmp/|' | sha256sum --check --strict
          mkdir /tmp/trivy
          tar -xzf "/tmp/$archive" -C /tmp/trivy trivy

      - name: Generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          for image in metaharmonizer-api metaharmonizer-web; do
            output="${image}.cdx.json"
            /tmp/trivy/trivy image --format cyclonedx --output "$output" --quiet "$image"
            component_count=$(jq '.components | length' "$output")
            echo "$image: $component_count components"
            case "$image" in
              metaharmonizer-api) minimum=250 ;;
              metaharmonizer-web) minimum=10 ;;
            esac
            test "$component_count" -ge "$minimum"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sboms-${{ github.sha }}
          path: metaharmonizer-*.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Scan application images
        run: |
          set -euo pipefail
          for image in metaharmonizer-api metaharmonizer-web; do
            report="/tmp/${image}.json"
            /tmp/trivy/trivy image --scanners vuln --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --format json --output "$report" --quiet "$image"
            jq -r '.Results[] | select(.Vulnerabilities != null) | .Target as $target | .Vulnerabilities[] | "\($target): \(.PkgName) \(.InstalledVersion) \(.VulnerabilityID) -> \(.FixedVersion)"' "$report"
            test "$(jq '[.Results[].Vulnerabilities[]?] | length' "$report")" = "0"
          done

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres redis api worker caddy

      - name: Wait for API health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "API healthy"; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy"; exit 1

      - name: Verify non-root runtime and writable volumes
        run: |
          set -e
          test "$(docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api id -u)" = "1000"
          test "$(docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T worker id -u)" = "1000"
          test "$(docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T caddy id -u)" = "1000"
          test "$(docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm web id -u)" = "1000"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api sh -c 'test -w /app/data/uploads && test -w /app/data/corpus && test -w /app/data/schema/versions && test -w /app/data/schema/aliases && test -w /home/app/.metaharmonizer && test -w /home/app/.cache/huggingface'

      - name: Seed bootstrap admin
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm seed

      - name: Smoke — login returns a token
        run: |
          set -e
          code=$(curl -s -o resp.json -w '%{http_code}' \
            -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"CiSmoke!2026"}')
          echo "login HTTP $code"
          cat resp.json
          test "$code" = "200"
          grep -q 'access_token' resp.json

      - name: Publish SPA assets for the browser journey
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up --no-deps --exit-code-from web web

      - name: Wait for the served application
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "Caddy origin ready"; exit 0
            fi
            sleep 2
          done
          echo "Caddy origin did not become ready"; exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install end-to-end browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Runs the authenticated journey rather than skipping it: the seeded
      # account above supplies the credentials the suite requires.
      - name: Run end-to-end journey
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_EMAIL: admin@example.com
          E2E_PASSWORD: CiSmoke!2026
        run: npx playwright test

      - name: Upload end-to-end report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  external-database:
    name: External Database Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write .env pointing at a database outside the stack
        run: |
          cat > .env <<'EOF'
          ENGINE_IMPL=mock
          JOB_MODE=queue
          AUTH_MODE=jwt
          HIBP_CHECK=false
          JWT_SECRET=ci-external-db-secret-key-at-least-32-bytes!!
          ALLOWED_EMAIL_DOMAINS=example.com
          SEED_EMAIL=admin@example.com
          SEED_PASSWORD=CiSmoke!2026
          SEED_ROLE=admin
          EXTERNAL_DATABASE_URL=postgresql+asyncpg://mh:external_pw@external-db:5432/metaharmonizer
          EOF

      # `external-db` stands in for a managed instance: a separate database the
      # stack reaches only by DSN. The bundled `postgres` service is never started.
      - name: Write CI override
        run: |
          cat > docker-compose.ci.yml <<'EOF'
          services:
            external-db:
              image: postgres:16-alpine
              environment:
                POSTGRES_USER: mh
                POSTGRES_PASSWORD: external_pw
                POSTGRES_DB: metaharmonizer
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U mh -d metaharmonizer"]
                interval: 5s
                timeout: 3s
                retries: 10
            api:
              ports:
                - "8000:8000"
              depends_on:
                external-db:
                  condition: service_healthy
            worker:
              depends_on:
                external-db:
                  condition: service_healthy
          EOF

      - name: Build the application image
        run: docker compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.ci.yml build api

      - name: Start the stack without the bundled Postgres
        run: docker compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.ci.yml up -d external-db redis api worker

      - name: Confirm the bundled Postgres never started
        run: |
          set -e
          running=$(docker compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.ci.yml ps --services --status running)
          echo "$running"
          ! echo "$running" | grep -qx postgres

      - name: Wait for API health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "API healthy against the external database"; exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.ci.yml logs --tail 120 api
          echo "API did not become healthy"; exit 1

      - name: Verify migrations ran in the external database
        run: |
          set -e
          count=$(docker compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.ci.yml exec -T external-db \
            psql -U mh -d metaharmonizer -tAc \
            "select count(*) from information_schema.tables where table_schema='public'")
          echo "public tables created: $count"
          test "$count" -gt 1

      - name: Seed an administrator and log in
        run: |
          set -e
          docker compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.ci.yml run --rm seed
          code=$(curl -s -o resp.json -w '%{http_code}' \
            -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"CiSmoke!2026"}')
          echo "login HTTP $code"
          cat resp.json
          test "$code" = "200"
          grep -q 'access_token' resp.json

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.ci.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.ci.yml down -v

  publish-release-sboms:
    name: Publish Release SBOMs
    if: github.ref_type == 'tag'
    needs: compose-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated SBOM artifacts
        uses: actions/download-artifact@v5
        with:
          name: cyclonedx-sboms-${{ github.sha }}

      - name: Attach SBOMs to tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --verify-tag --generate-notes
          gh release upload "${{ github.ref_name }}" \
            metaharmonizer-api.cdx.json \
            metaharmonizer-web.cdx.json \
            --clobber
