name: Security Gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "$base/$archive" -o "/tmp/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          grep " $archive$" /tmp/gitleaks-checksums.txt | sed 's|  |  /tmp/|' | sha256sum --check --strict
          mkdir /tmp/gitleaks
          tar -xzf "/tmp/$archive" -C /tmp/gitleaks gitleaks
          /tmp/gitleaks/gitleaks git . --log-opts="--all" --redact=100 --no-banner

  python-dependencies:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize local wheel path
        run: sed 's|^\./vendor/|./backend/vendor/|' backend/requirements.txt > .audit-requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --vulnerability-service osv --requirement .audit-requirements.txt

  node-dependencies:
    name: Node Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Audit frontend runtime dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Audit E2E dependencies
        working-directory: e2e
        run: npm audit --audit-level=high

  configuration:
    name: Deployment Configuration Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan deployment configuration with Trivy
        env:
          TRIVY_VERSION: "0.73.0"
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfL "$base/$archive" -o "/tmp/$archive"
          curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" -o /tmp/trivy-checksums.txt
          grep " $archive$" /tmp/trivy-checksums.txt | sed 's|  |  /tmp/|' | sha256sum --check --strict
          mkdir /tmp/trivy
          tar -xzf "/tmp/$archive" -C /tmp/trivy trivy
          /tmp/trivy/trivy config --severity HIGH,CRITICAL --exit-code 1 --quiet .

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
