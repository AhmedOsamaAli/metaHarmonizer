name: Knowledge Base Refresh

# Rebuilds the offline KB + embedding-model bundle from the *current* source
# ontologies and republishes it as the `kb-latest` release asset. The engine KB
# is a point-in-time snapshot; run this occasionally to pick up newer
# NCIt / UBERON / GO / CL terms.
#
# Base corpora fetch key-free (NCIt via EVSREST, UBERON via OLS4). Set the
# optional `UMLS_API_KEY` repo secret to add synonym enrichment.
#
# Republishing changes the bundle's sha256, so the job opens a PR bumping
# KB_BUNDLE_SHA256 in .env.example — merge it to keep integrity checks valid.
#
# It carries EFO + the warmed schema cache forward from the current published
# bundle (neither is rebuildable), refreshes the fetchable ontologies, and
# verifies the result is a superset before republishing.
#
# Manual-only for now: enable the `schedule:` trigger below only after a manual
# run has been validated end-to-end.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 3 1 */3 *"   # quarterly — enable after validating a manual run

permissions:
  contents: write        # upload the release asset + push the sha-bump branch
  pull-requests: write   # open the sha-bump PR

concurrency:
  group: kb-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # Build into the repo checkout so package_kb finds the KB + corpus.
      KNOWLEDGE_DB_DIR: ${{ github.workspace }}/backend/kb_build
      METAHARMONIZER_DATA_DIR: ${{ github.workspace }}/backend/data
      # Optional: only adds synonym enrichment; the base build works without it.
      UMLS_API_KEY: ${{ secrets.UMLS_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend + vendored engine wheel
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the KB (fetch ontologies + build FAISS indexes)
        working-directory: backend
        # NOTE: HF_HUB_OFFLINE is intentionally unset here so the embedding
        # models download during the build; the bundle then ships them for
        # offline runtime use.
        run: python -m scripts.build_kb

      - name: Fetch the current published bundle (source of EFO + warmed cache)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cur
          gh release download kb-latest -p kb_offline_bundle.tar.gz -D /tmp/cur

      - name: Graft EFO + warmed schema cache forward (not rebuildable)
        working-directory: backend
        run: python -m scripts.graft_efo --from-bundle /tmp/cur/kb_offline_bundle.tar.gz

      - name: Package the offline bundle
        working-directory: backend
        run: python -m scripts.package_kb -o ../kb/kb_offline_bundle.tar.gz

      - name: Verify the bundle is a superset (EFO + 4 corpora + KB + models)
        run: |
          python -c "import sys,tarfile; n=set(tarfile.open('kb/kb_offline_bundle.tar.gz').getnames()); req={'kb.mhkb.tar.gz','corpus/retrieved_ontologies/efo_phenotype_corpus.csv','corpus/retrieved_ontologies/ncit_disease_corpus.csv','corpus/retrieved_ontologies/ncit_treatment_corpus.csv','corpus/retrieved_ontologies/uberon_bodysite_corpus.csv'}; tops={x.split('/')[0] for x in n}; miss=[r for r in req if r not in n]+[t for t in ('model_cache','hf_hub') if t not in tops]; sys.exit('NOT A SUPERSET: %s' % miss) if miss else print('verified superset: EFO + 4 corpora + KB + models')"

      - name: Compute sha256
        id: sha
        run: |
          SHA=$(sha256sum kb/kb_offline_bundle.tar.gz | awk '{print $1}')
          SIZE=$(stat -c%s kb/kb_offline_bundle.tar.gz)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### KB bundle"
            echo "- size: ${SIZE} bytes"
            echo "- sha256: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Republish to the kb-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload kb-latest kb/kb_offline_bundle.tar.gz --clobber

      - name: Open a PR bumping KB_BUNDLE_SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ steps.sha.outputs.sha256 }}"
          sed -i -E "s|^KB_BUNDLE_SHA256=.*|KB_BUNDLE_SHA256=${SHA}  # integrity check of the current bundle|" .env.example
          if git diff --quiet -- .env.example; then
            echo "sha256 unchanged — no PR needed"; exit 0
          fi
          BR="kb-refresh/sha-${SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add .env.example
          git commit -m "chore(kb): bump KB_BUNDLE_SHA256 after KB refresh"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "Refresh KB bundle (bump sha256)" \
            --body "Automated KB rebuild republished to \`kb-latest\`. New sha256: \`${SHA}\`. Merge to keep the download integrity check in sync."
