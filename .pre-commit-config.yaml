# See https://pre-commit.com for hook configuration.
# Install with: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: no-engine-leaks
        name: forbid engine imports outside engine_adapter
        description: |
          Only backend/app/engine_adapter/ may import `metaharmonizer`,
          `src.*`, or `engine.src.*`. See backend/app/engine_adapter/README.md.
        entry: python scripts/check_engine_boundary.py
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: true
      - id: verify-unused-nltk-removed
        name: verify unused NLTK dependency stays removed
        description: |
          The vendored engine does not use NLTK and must not declare it as a
          transitive dependency.
        entry: python scripts/strip_unused_nltk_dependency.py
        language: system
        files: ^(backend/(app/.*\.py|vendor/metaharmonizer-.*\.whl)|mcp/.*\.py|scripts/strip_unused_nltk_dependency\.py)$
        pass_filenames: false
