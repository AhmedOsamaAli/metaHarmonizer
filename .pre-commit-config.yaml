# See https://pre-commit.com for hook configuration.
# Install with: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: no-engine-leaks
        name: forbid engine imports outside engine_adapter
        description: |
          Only backend/app/engine_adapter/ may import `metaharmonizer`,
          `src.*`, or `engine.src.*`. See backend/app/engine_adapter/README.md.
        entry: python scripts/check_engine_boundary.py
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: true
      - id: guard-nltk-advisory-exception
        name: guard the NLTK audit exception
        description: |
          The NLTK advisory exception is valid only while application and
          vendored-engine runtime code do not reference NLTK.
        entry: python scripts/check_nltk_advisory_exception.py
        language: system
        files: ^(backend/(app/.*\.py|vendor/metaharmonizer-.*\.whl)|mcp/.*\.py|scripts/check_nltk_advisory_exception\.py)$
        pass_filenames: false
