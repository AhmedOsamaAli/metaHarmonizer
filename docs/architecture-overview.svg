<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">MetaHarmonizer system architecture and workflow</title>
  <desc id="desc">Clients enter through Caddy into FastAPI. Redis queues model work for an arq worker, PostgreSQL stores durable state, and host volumes hold study files and model assets. GitHub Actions validates releases while systemd performs knowledge-base rollout, monitoring, backup, alerts, and rollback.</desc>
