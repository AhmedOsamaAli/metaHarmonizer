      text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:32px;font-weight:750;fill:#f8fafc}.subtitle{font-size:15px;fill:#9fb0c7}.lane{font-size:11px;font-weight:800;letter-spacing:2px;fill:#7dd3fc}.group{font-size:13px;font-weight:750;letter-spacing:1.4px;fill:#bfdbfe}.nt{font-size:17px;font-weight:750;fill:#f8fafc}.nt-compact{font-size:15px;font-weight:750;fill:#f8fafc}.copy{font-size:11.5px;fill:#aab8cc}.small{font-size:10.5px;fill:#94a3b8}.chip{font-size:10px;font-weight:700;fill:#dbeafe}.label{font-size:10.5px;font-weight:650;fill:#cbd5e1}.footer{font-size:11px;fill:#cbd5e1}.ico{fill:none;stroke:#cbd5e1;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.request{fill:none;stroke:#38bdf8;stroke-width:2.4;stroke-linecap:round;marker-end:url(#a-blue)}.queue{fill:none;stroke:#fbbf24;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:9 7;marker-end:url(#a-amber);animation:travel 1.6s linear infinite}.data{fill:none;stroke:#34d399;stroke-width:2.2;stroke-linecap:round;marker-end:url(#a-green)}.engine{fill:none;stroke:#a78bfa;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:9 7;marker-end:url(#a-violet);animation:travel 1.8s linear infinite}.auto{fill:none;stroke:#94a3b8;stroke-width:2.1;stroke-linecap:round;stroke-dasharray:3 7;marker-end:url(#a-gray)}.pulse{animation:pulse 2.3s ease-in-out infinite;transform-origin:center}@keyframes travel{to{stroke-dashoffset:-32}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.queue,.engine,.pulse{animation:none}}
    </style>
